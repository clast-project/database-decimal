name: Audit

# Restore fails on any known-vulnerable package (see NuGet Audit in
# Directory.Build.props), but restore only runs when something is pushed. This
# runs it weekly so an advisory published during a quiet stretch still turns up
# as a failed run, which GitHub emails to the repository owner.
#
# GitHub disables scheduled workflows after 60 days without repository activity;
# re-enable this one from the Actions tab if that happens.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Windows: the test project adds net472 only when $(OS) is Windows_NT, so
    # restoring elsewhere would skip (and not audit) that dependency graph.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # A failure names the package, version, severity and advisory URL.
      - name: Restore (fails on vulnerable packages)
        run: dotnet restore --force-evaluate
