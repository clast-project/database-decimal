name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write   # required for creating GitHub Releases
      id-token: write   # required for NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # SourceLink wants full history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/Clast.DatabaseDecimal/Clast.DatabaseDecimal.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }}

      # Trusted Publishing: exchange this run's GitHub OIDC token for a
      # short-lived nuget.org API key. The nuget.org policy is bound to this
      # repository and to this workflow file, so renaming release.yml needs
      # the policy updated too. No long-lived key is stored in the repo.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: curt_hagenlocher

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          dotnet nuget push "src/Clast.DatabaseDecimal/bin/Release/Clast.DatabaseDecimal.${{ steps.version.outputs.version }}.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "src/Clast.DatabaseDecimal/bin/Release/Clast.DatabaseDecimal.${{ steps.version.outputs.version }}.nupkg" `
            "src/Clast.DatabaseDecimal/bin/Release/Clast.DatabaseDecimal.${{ steps.version.outputs.version }}.snupkg" `
            --generate-notes