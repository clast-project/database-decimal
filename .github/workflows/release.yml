name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Clast.DatabaseDecimal/Clast.DatabaseDecimal.csproj

      - name: Pack
        run: dotnet pack src/Clast.DatabaseDecimal/Clast.DatabaseDecimal.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Push to NuGet
        shell: bash
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
